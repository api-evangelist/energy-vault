aid: energy-vault
name: Energy Vault
description: 'Energy Vault Holdings (NYSE: NRGV) is a Swiss-founded, US-headquartered energy storage
  company delivering grid-scale storage hardware, software, and services worldwide. Its portfolio spans
  battery energy storage (B-VAULT), gravity-based storage (G-VAULT / EVx), and green-hydrogen storage
  (H-VAULT), unified by VaultOS, an energy management software platform providing real-time monitoring,
  operational control, and optimized dispatch across storage and generation assets, alongside Vault
  Bidder and Vault Manager for market bidding and asset management. The company serves utilities,
  independent power producers, and large energy users, with more than 1.4 GWh deployed since 2023. Backed
  by SoftBank Vision Fund, Energy Vault is a frontier-tech company in the API Evangelist network. As of
  this enrichment pass it publishes no public developer API, developer portal, SDK, or API reference;
  VaultOS is delivered as a proprietary, deployment-integrated platform rather than a public API product.'
